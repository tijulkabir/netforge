[package]
name = "netforge"
version = "2.0.0"
edition = "2021"
description = "High-performance cyber transformation engine for red team operations"
authors = ["Tijul Kabir Toha <toha.240113@s.pust.ac.bd>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/tijulkabir/netforge"
homepage = "https://tijulkabir.me"
keywords = ["red-team", "cybersecurity", "binary", "crypto", "pe-parser"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
md-5 = "0.10"
blake3 = { version = "1", features = ["rayon"] }
md4 = "0.11.0"
memmap2 = "0.9.11"
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
proptest = "1.12.0"
