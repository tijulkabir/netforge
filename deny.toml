# cargo-deny configuration — supply-chain gate for NetForge.
# Run locally with: cargo deny check
# CI runs: cargo deny check advisories bans licenses sources

[advisories]
# Fail the build on any RUSTSEC advisory affecting the dependency tree.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with NetForge's own MIT license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# A duplicate crate version is a warning, not a hard failure.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io and vetted registries; no surprise git or unknown sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
